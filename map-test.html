<!DOCTYPE html>
<html>
<head>
    <title>Map Test</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
        #mapid { height: 400px; width: 100%; border: 2px solid #ccc; }
        .info { margin: 10px 0; padding: 10px; background: #f5f5f5; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>🗺️ Smart India Hackathon 2025 - Map Test</h1>
    <div class="info">
        <strong>Testing:</strong> Basic Leaflet map with OpenStreetMap tiles and Mumbai location
    </div>
    <div id="mapid"></div>
    <div class="info" id="status">Loading map...</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        try {
            console.log('Creating map...');
            var mymap = L.map('mapid').setView([19.0760, 72.8777], 11);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(mymap);

            // Add sample markers for our reports
            var reports = [
                { lat: 19.0544, lng: 72.8406, title: 'Large Pothole on Western Express Highway', status: 'in-progress' },
                { lat: 19.1136, lng: 72.8697, title: 'Overflowing Garbage Bins in Market Area', status: 'pending' },
                { lat: 19.1197, lng: 72.9056, title: 'Broken Street Light on Main Road', status: 'resolved' },
                { lat: 19.1875, lng: 72.8258, title: 'Water Leakage from Underground Pipe', status: 'in-progress' },
                { lat: 19.1653, lng: 72.8526, title: 'Damaged Traffic Signal', status: 'acknowledged' }
            ];

            reports.forEach(function(report) {
                var marker = L.marker([report.lat, report.lng]).addTo(mymap);
                marker.bindPopup("<b>" + report.title + "</b><br>Status: " + report.status);
            });

            document.getElementById('status').innerHTML = 
                '✅ <strong>Success!</strong> Map loaded with ' + reports.length + ' civic issue markers. ' +
                '<br>📍 Center: Mumbai (19.0760, 72.8777)' +
                '<br>🎯 Zoom level: 11';

            console.log('Map created successfully!');
        } catch (error) {
            console.error('Map creation failed:', error);
            document.getElementById('status').innerHTML = 
                '❌ <strong>Error:</strong> ' + error.message;
        }
    </script>
</body>
</html>
